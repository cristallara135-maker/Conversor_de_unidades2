!DOCTYPE html>
<html>
<head>
    <title>Conversor de unidades</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">

        <h1>Conversor de unidades</h1>

        <label>Ingresa tu cantidad en cm</label>

        <input type="number" id="cantidad" placeholder="Escribe una cantidad">
        <br><br>

        <select id="unidad">
            <option value="mm">Milímetros</option>
            <option value="m">Metros</option>
            <option value="km">Kilómetros</option>
            <option value="p">Pulgadas</option>
        </select>
         <br><br>

        <button onclick="calcular()">Calcular</button>
         <br><br>

        <h3 id="resultado">Resultado:</h3>
        <img src="https://www.semana.com/resizer/v2/V2KHHDQW5JBOLITIESXA4SH4Q4.jpg?auth=b0b2350219c298a13bb2051be6e780614118d0adbfd1ce6088d9f283d0fc705c&width=8256&height=4785">

    </div>

    <script src="script.js"></script>

</body>
</html>
